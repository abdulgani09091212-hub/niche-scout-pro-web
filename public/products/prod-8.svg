<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-prod-8.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="glow-prod-8.svg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="16" fill="url(#bg-prod-8.svg)" />
  <rect width="600" height="450" rx="16" fill="url(#glow-prod-8.svg)" />

  <!-- Subtle Mockup Canvas Container -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="480" height="300" rx="12" fill="#ffffff" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Header Surface Strip -->
    <rect width="480" height="60" rx="12" fill="#f8fafc" />
    <line x1="0" y1="60" x2="480" y2="60" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Three Window Controls -->
    <circle cx="28" cy="30" r="5" fill="#f87171" />
    <circle cx="44" cy="30" r="5" fill="#fbbf24" />
    <circle cx="60" cy="30" r="5" fill="#34d399" />
    
    <!-- Category Badge -->
    <rect x="340" y="18" width="120" height="24" rx="6" fill="#475569" />
    <text x="400" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">MARKETING KIT</text>

    <!-- Content Workspace -->
    <rect x="30" y="85" width="220" height="185" rx="8" fill="#f1f5f9" stroke="#e2e8f0" />
    
    <!-- Simulated Content Wireframe Elements -->
    <rect x="45" y="105" width="80" height="8" rx="4" fill="#94a3b8" />
    <rect x="45" y="125" width="170" height="6" rx="3" fill="#cbd5e1" />
    <rect x="45" y="139" width="150" height="6" rx="3" fill="#cbd5e1" />
    <rect x="45" y="153" width="130" height="6" rx="3" fill="#cbd5e1" />
    
    <rect x="45" y="175" width="190" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0" />
    <line x1="45" y1="200" x2="235" y2="200" stroke="#f1f5f9" stroke-width="1" />
    <circle cx="65" cy="188" r="4" fill="#94a3b8" />
    <rect x="76" y="185" width="60" height="6" rx="3" fill="#94a3b8" />
    <line x1="45" y1="225" x2="235" y2="225" stroke="#f1f5f9" stroke-width="1" />
    <circle cx="65" cy="213" r="4" fill="#475569" />
    <rect x="76" y="210" width="80" height="6" rx="3" fill="#94a3b8" />

    <!-- Right Side Product Spec Sheet -->
    <text x="275" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Luxury Realtor Presentation</text>
    <text x="275" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Canva 32-Page Editorial Proposal</text>

    <!-- Key Metrics Badges inside mockup -->
    <g transform="translate(275, 160)">
      <rect width="90" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="10" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">EST. CONV.</text>
      <text x="10" y="32" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">4.8%</text>

      <rect x="98" width="90" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="108" y="16" font-family="sans-serif" font-size="9" font-weight="700" fill="#94a3b8">RETENTION</text>
      <text x="108" y="32" font-family="sans-serif" font-size="13" font-weight="800" fill="#059669">98.4%</text>
    </g>

    <!-- In-Demand Social Proof Pill -->
    <g transform="translate(275, 220)">
      <rect width="188" height="32" rx="16" fill="#fef2f2" stroke="#fecaca" />
      <circle cx="16" cy="16" r="4" fill="#ef4444" />
      <text x="28" y="20" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">VERIFIED BESTSELLER STATUS</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="300" y="415" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="0.5">NICHE SCOUT PRO · 2026 BENCHMARK ASSET</text>
</svg>